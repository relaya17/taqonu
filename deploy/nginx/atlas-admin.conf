# Atlas Owner Admin — Tailscale-only reverse proxy.
#
# Why this file exists:
#   apps/admin reuses ATLAS_CONTROL_PLANE_TOKEN for BOTH its outbound calls to
#   the Control Plane and its own inbound bearer check (apps/admin/src/admin-auth.ts).
#   Once that variable is set, every inbound request must carry an
#   Authorization header — which a browser cannot send from the URL bar.
#   This proxy injects the header so the Owner UI is reachable in a browser
#   without weakening the application-layer check.
#
# Security model (ADR-021):
#   layer 1 — Tailscale/WireGuard authenticates the device at the network layer
#   layer 2 — the injected bearer token authenticates at the application layer
#   The upstream never binds anything but 127.0.0.1.
#
# NEVER change `listen` to 0.0.0.0 or add a public server_name.
# __TAILSCALE_IP__ is substituted by deploy/bootstrap.sh.

server {
    listen __TAILSCALE_IP__:8443;
    server_name _;

    # Owner UI is private; keep it out of every index.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/atlas-admin.access.log;
    error_log  /var/log/nginx/atlas-admin.error.log warn;

    client_max_body_size 1m;

    location / {
        # Root-only snippet holding:
        #   proxy_set_header Authorization "Bearer <ATLAS_CONTROL_PLANE_TOKEN>";
        # Created by bootstrap.sh with mode 0600. Never committed.
        include /etc/nginx/snippets/atlas-admin-auth.conf;

        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }
}

# Optional: Control Plane dashboard over Tailscale.
# Leave commented unless you need the CP UI remotely. The CP already requires
# its own bearer token, so no header injection is performed here — supply the
# token yourself (e.g. via a REST client) rather than weakening the check.
#
# server {
#     listen __TAILSCALE_IP__:8444;
#     server_name _;
#     add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
#     location / {
#         proxy_pass http://127.0.0.1:3100;
#         proxy_http_version 1.1;
#         proxy_set_header Host $host;
#     }
# }
