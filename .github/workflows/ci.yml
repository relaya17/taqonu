name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build packages + API
        # Turbo ^build ordering; do not rely on checked-in tsbuildinfo (dist is gitignored).
        run: pnpm exec turbo run build --filter=@atlas/api...
      - name: Unit tests
        run: pnpm test:unit
      - name: Lint
        run: pnpm exec eslint packages apps --max-warnings 0
      - name: Atlas CI eval gate (blocking)
        env:
          ATLAS_SKIP_AUDIT_LOG: "1"
          ATLAS_SKIP_METRICS_LOG: "1"
          NODE_ENV: test
        run: pnpm --filter @atlas/api exec tsx src/scripts/ci-eval-gate.ts
      - name: Atlas CI secret scan (blocking)
        env:
          ATLAS_SKIP_AUDIT_LOG: "1"
          ATLAS_SKIP_METRICS_LOG: "1"
          NODE_ENV: test
        run: pnpm --filter @atlas/api exec tsx src/scripts/ci-secrets-scan.ts
      - name: Supply-chain SBOM verify (unsigned is expected)
        run: pnpm sbom:generate && pnpm supply-chain:verify
      - name: Supply-chain sign refusal (do not mint a placeholder)
        run: pnpm supply-chain:sign
