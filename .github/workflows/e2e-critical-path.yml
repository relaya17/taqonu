name: E2E critical path

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API + Web
        run: pnpm exec turbo run build --filter=@atlas/api --filter=@atlas/web

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start stack
        run: |
          set -e
          pnpm --filter @atlas/api start &
          pnpm --filter @atlas/web exec next start --port 3000 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4000/api/v1/health >/dev/null \
              && curl -sf http://127.0.0.1:3000/he >/dev/null; then
              echo "stack ready"
              exit 0
            fi
            sleep 2
          done
          echo "stack failed to become ready"
          exit 1
        env:
          NODE_ENV: production
          PORT: 4000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000

      - name: Critical-path smoke
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
