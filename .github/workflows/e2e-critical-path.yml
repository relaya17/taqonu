name: E2E critical path

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  NODE_ENV: production
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
  SUPABASE_URL: http://127.0.0.1:54321
  SUPABASE_ANON_KEY: e2e-anon-key-replace-me
  SUPABASE_SERVICE_ROLE_KEY: e2e-service-role-replace-me
  ENCRYPTION_KEY: "12345678901234567890123456789012"
  COOKIE_SECRET: "12345678901234567890123456789012"
  API_PORT: "4000"
  WEB_ORIGIN: http://127.0.0.1:3000
  NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
  NEXT_PUBLIC_APP_NAME: ArletOS
  NEXT_PUBLIC_PRODUCT_CODENAME: Atlas
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key-replace-me
  GITHUB_WEBHOOK_SECRET: e2e-github-webhook-test-secret
  ATLAS_SKIP_AUDIT_LOG: "1"
  ATLAS_SKIP_METRICS_LOG: "1"
  ATLAS_SKIP_STORE_PERSIST: "1"

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages + API + Web
        run: pnpm exec turbo run build --filter=@atlas/api --filter=@atlas/web

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start stack
        run: |
          set -e
          pnpm --filter @atlas/api start > /tmp/atlas-api.log 2>&1 &
          pnpm --filter @atlas/web exec next start --port 3000 > /tmp/atlas-web.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:4000/api/v1/health >/dev/null \
              && curl -sf http://127.0.0.1:3000/he >/dev/null; then
              echo "stack ready"
              exit 0
            fi
            sleep 2
          done
          echo "=== api log ==="
          cat /tmp/atlas-api.log || true
          echo "=== web log ==="
          cat /tmp/atlas-web.log || true
          echo "stack failed to become ready"
          exit 1

      - name: Critical-path smoke
        run: pnpm test:e2e:critical
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_API_URL: http://127.0.0.1:4000
          CI: true

      - name: Product surfaces + security + a11y suites
        run: pnpm test:e2e:product && pnpm test:e2e:security && pnpm test:e2e:a11y
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_API_URL: http://127.0.0.1:4000
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
