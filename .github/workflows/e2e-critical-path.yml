name: E2E critical path

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  # Kept as "production" (not "test") on purpose: this job's security suite
  # (test:e2e:security) exercises production-only code paths — the Secure
  # cookie flag in sessionCookie()/serializeSupabaseSessionCookie() and the
  # password-reset-token exposure guard in auth.ts — both gated on
  # `NODE_ENV === "production"`. Switching this to "test" would silently
  # stop testing that behavior.
  NODE_ENV: production
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
  SUPABASE_URL: http://127.0.0.1:54321
  SUPABASE_ANON_KEY: e2e-anon-key-replace-me
  # Must be exactly "replace-me": isLiveSupabase() treats any non-"replace-me"
  # key paired with this localhost SUPABASE_URL as live once it's >20 chars
  # long (its "local Supabase is live if not placeholder key" branch). A
  # longer placeholder like the old "e2e-service-role-replace-me" trips that
  # branch, so checkDatabase() in health-check.ts tries a real network call
  # to 127.0.0.1:54321 (nothing is listening there during the earlier
  # suites), and /api/v1/health never turns HEALTHY — the "Start stack"
  # step's readiness loop spins until its timeout and the job fails.
  # Stage 9 replaces this sentinel after `supabase start`. It reads the
  # disposable instance's own key from `supabase status` and does not
  # invent a longer placeholder.
  SUPABASE_SERVICE_ROLE_KEY: replace-me
  # Must be 32+ chars (schema: z.string().min(32)) but must NOT equal the
  # literal "12345678901234567890123456789012" documented in env.ts as
  # EXAMPLE_SECRET — assertNotExampleSecrets() rejects that exact value and
  # calls process.exit(1) whenever NODE_ENV === "production", which this job
  # sets above.
  ENCRYPTION_KEY: "e2e-ci-encryption-key-not-example-32c"
  COOKIE_SECRET: "e2e-ci-cookie-secret-not-example-32ch"
  API_PORT: "4000"
  WEB_ORIGIN: http://127.0.0.1:3000
  NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
  NEXT_PUBLIC_APP_NAME: ArletOS
  NEXT_PUBLIC_PRODUCT_CODENAME: Atlas
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key-replace-me
  GITHUB_WEBHOOK_SECRET: e2e-github-webhook-test-secret
  # Do not set ATLAS_SKIP_AUDIT_LOG here. NODE_ENV=production makes
  # appendAuditLogLine throw "forbidden in production", and Studio
  # ask-agent writes an audit line. That combination returns HTTP 500.
  # The runner writes the real audit log. Store persist stays skipped.
  ATLAS_SKIP_METRICS_LOG: "1"
  ATLAS_SKIP_STORE_PERSIST: "1"
  # Local/CI Stage 9 SoD fixture only. Never set on Production Vercel.
  # bootstrapRole reads this only when the user is created. A fresh auth
  # file keeps a previous role=user record from being reused.
  ATLAS_OPERATOR_EMAILS: stage9-decider@atlas.test
  ATLAS_AUTH_PATH: /tmp/atlas-stage9-users.json
  ATLAS_SESSIONS_PATH: /tmp/atlas-stage9-sessions.json

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages + API + Web
        run: pnpm exec turbo run build --filter=@atlas/api --filter=@atlas/web

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start stack
        run: |
          set -e
          pnpm --filter @atlas/api start > /tmp/atlas-api.log 2>&1 &
          echo $! > /tmp/atlas-api.pid
          pnpm --filter @atlas/web exec next start --port 3000 > /tmp/atlas-web.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:4000/api/v1/health >/dev/null \
              && curl -sf http://127.0.0.1:3000/he >/dev/null; then
              echo "stack ready"
              exit 0
            fi
            sleep 2
          done
          echo "=== api log ==="
          cat /tmp/atlas-api.log || true
          echo "=== web log ==="
          cat /tmp/atlas-web.log || true
          echo "stack failed to become ready"
          exit 1

      - name: Critical-path smoke
        run: pnpm test:e2e:critical
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_API_URL: http://127.0.0.1:4000
          CI: true

      - name: Product surfaces + security + a11y suites
        run: pnpm test:e2e:product && pnpm test:e2e:security && pnpm test:e2e:a11y
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_API_URL: http://127.0.0.1:4000
          CI: true

      - name: Start disposable approval store
        run: |
          set -euo pipefail
          npx --yes supabase start
          npx --yes supabase status -o env > /tmp/supabase-status.env
          chmod 600 /tmp/supabase-status.env
          set -a
          # shellcheck disable=SC1091
          . /tmp/supabase-status.env
          set +a
          if [ -z "${API_URL:-}" ] || [ -z "${ANON_KEY:-}" ] || [ -z "${SERVICE_ROLE_KEY:-}" ] || [ -z "${DB_URL:-}" ]; then
            echo "supabase status did not provide the local API URL and keys"
            exit 1
          fi
          echo "::add-mask::${SERVICE_ROLE_KEY}"
          echo "::add-mask::${ANON_KEY}"
          echo "::add-mask::${DB_URL}"
          {
            echo "SUPABASE_URL=${API_URL}"
            echo "SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "DATABASE_URL=${DB_URL}"
          } >> "$GITHUB_ENV"
          rm -f /tmp/supabase-status.env
          curl -sf "${API_URL}/rest/v1/" -H "apikey: ${ANON_KEY}" -o /dev/null

      - name: Stage 9 authenticated fixtures
        run: |
          set -euo pipefail
          if [ "${SUPABASE_SERVICE_ROLE_KEY}" = "replace-me" ]; then
            echo "disposable approval store was not provisioned"
            exit 1
          fi
          if [ -f /tmp/atlas-api.pid ]; then
            kill "$(cat /tmp/atlas-api.pid)" 2>/dev/null || true
          fi
          sleep 1
          pids="$(ss -lptnH 'sport = :4000' | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u || true)"
          if [ -n "${pids}" ]; then
            kill ${pids} 2>/dev/null || true
            sleep 1
          fi
          pnpm --filter @atlas/api start > /tmp/atlas-api-stage9.log 2>&1 &
          echo $! > /tmp/atlas-api.pid
          for i in $(seq 1 60); do
            code="$(curl -s -o /tmp/atlas-health.json -w "%{http_code}" http://127.0.0.1:4000/api/v1/health || true)"
            if [ "${code}" = "200" ]; then
              echo "api ready with the disposable approval store"
              break
            fi
            if [ "${i}" = "60" ]; then
              echo "api health stayed HTTP ${code}"
              exit 1
            fi
            sleep 2
          done
          pnpm test:e2e:stage9
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_API_URL: http://127.0.0.1:4000
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
